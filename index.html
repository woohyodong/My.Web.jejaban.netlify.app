  <!-- site.js (Theme/Overlay 등 공통) -->
  <script defer src="/js/site.js"></script>

  <script>
    // ---------- Utils ----------
    const qs = (id) => document.getElementById(id);
    const clamp = (n, min, max) => Math.min(Math.max(n, min), max);

    const safeJSON = {
      read(key, fallback) {
        try {
          const raw = localStorage.getItem(key);
          if (!raw) return fallback;
          return JSON.parse(raw);
        } catch (_) {
          return fallback;
        }
      },
      write(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      },
    };

    const countDoneMap = (map) => Object.values(map || {}).filter(Boolean).length;

    function getPrayerCount() {
      try {
        const raw = localStorage.getItem("nalmada-prayers:v1");
        if (!raw) return 0;
        const parsed = JSON.parse(raw);
        return Array.isArray(parsed) ? parsed.length : 0;
      } catch (_) {
        return 0;
      }
    }

    function setProgressUI(prefix, done, total) {
      done = clamp(done, 0, total);
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      const textEl = qs(`${prefix}-progress-text`);
      const barEl  = qs(`${prefix}-progress-bar`);
      if (!textEl || !barEl) return;

      textEl.textContent = `${done} / ${total} (${pct}%)`;
      barEl.style.width = `${(done / total) * 100}%`;

      if (pct >= 100) {
        barEl.classList.remove("bg-blue-600");
        barEl.classList.add("bg-emerald-600");
      }
    }

    // ---------- Prayer Count ----------
    const updatePrayerCard = () => {
      const count = getPrayerCount();
      const card = document.querySelector('a[href="/prayer/"] .text-sm');
      if (card) card.textContent = `저장된 기도문 ${count}개`;
    };

    updatePrayerCard();
    window.addEventListener("storage", (event) => {
      if (event.key === "nalmada-prayers:v1") updatePrayerCard();
    });

    // ---------- SW ----------
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/sw.js");
    }

  // ---------- Share (FIX: TWA share 목적) ----------
  const APP_PACKAGE = "app.netlify.jejaban.twa";
  const PLAY_URL = `https://play.google.com/store/apps/details?id=${encodeURIComponent(APP_PACKAGE)}`;
  const TWA_SESSION_KEY = "jejaban:twa-session:v1";

  const detectTwaSession = () => {
    const isAndroid = /Android/i.test(navigator.userAgent);
    const ref = String(document.referrer || "");
    const referrerMatch = ref.startsWith(`android-app://${APP_PACKAGE}`);
    const isStandalone = window.matchMedia?.("(display-mode: standalone)")?.matches ?? false;
    const looksWebView = /\bwv\b/i.test(navigator.userAgent) || /Version\/\d+/i.test(navigator.userAgent);

    let storedTwa = false;
    try {
      storedTwa = sessionStorage.getItem(TWA_SESSION_KEY) === "1";
    } catch (_) {}

    const isTwa = Boolean(storedTwa || referrerMatch || (isAndroid && isStandalone && looksWebView));

    try {
      if (isTwa) sessionStorage.setItem(TWA_SESSION_KEY, "1");
    } catch (_) {}

    return { isAndroid, isTwa };
  };

  detectTwaSession();

  qs("share-btn")?.addEventListener("click", async () => {
    const APP_PACKAGE = "app.netlify.jejaban.twa";
    const PLAY_URL = `https://play.google.com/store/apps/details?id=${encodeURIComponent(APP_PACKAGE)}`;

    const title = "제자훈련 신앙생활";
    const text = "42주 성경 1독 · 32주 암송 · 중보기도";
    const siteUrl = `${location.origin}/`;

    const isAndroid = /Android/i.test(navigator.userAgent);

    // TWA에서 넘어오면 referrer가 android-app://<package> 형태로 잡히는 경우가 많음
    const isTwa = (() => {
      const ref = String(document.referrer || "");
      if (ref.startsWith(`android-app://${APP_PACKAGE}`)) return true;

      // 보조 판별(환경 편차 대비)
      const isStandalone = window.matchMedia?.("(display-mode: standalone)")?.matches ?? false;
      const ua = navigator.userAgent;
      const looksWebView = /\bwv\b/i.test(ua) || /Version\/\d+/i.test(ua);
      return Boolean(isAndroid && isStandalone && looksWebView);
    })();

    // ✅ 공유는 "실행"이 아니라 "전달"이 목적이므로:
    // TWA(앱)에서는 Play 링크 공유(가장 기대 동작이 명확)
    // 웹에서는 사이트 링크 공유
    const shareUrl = (() => {
      const shareTarget = detectTwaSession();
      return (shareTarget.isTwa && shareTarget.isAndroid) ? PLAY_URL : siteUrl;
    })();

    const copyToClipboard = async (value) => {
      const v = String(value ?? "");
      if (navigator.clipboard?.writeText) {
        await navigator.clipboard.writeText(v);
        return;
      }
      const ta = document.createElement("textarea");
      ta.value = v;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      ta.remove();
    };

    try {
      if (navigator.share) {
        await navigator.share({ title, text, url: shareUrl });
        return;
      }
      await copyToClipboard(shareUrl);
      alert("링크를 복사했어요!");
    } catch (e) {
      // ✅ 무반응 방지: share가 실패하면 즉시 복사 fallback
      try {
        await copyToClipboard(shareUrl);
        alert("공유가 불가하여 링크를 복사했어요!");
      } catch (_) {
        // 최후 수단: 그래도 조용히 종료
        console.warn("Share failed:", e);
      }
    }
  });

  // ---------- Home Progress ----------
  async function initHomeProgress() {
    // 1) 32주 암송 (✅ year 유동 대응)
    try {
      const memoData = await fetch("/memorize/data.json", { cache: "no-store" }).then(r => r.json());
      const totalWeeks = Array.isArray(memoData?.weeks) ? memoData.weeks.length : 52;

      const currentYear = new Date().getFullYear();

      // localStorage에 저장된 memorized:* 키 중에서 "현재 연도 우선, 없으면 완료가 가장 많은 연도" 선택
      const memoKeys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("memorized:")) memoKeys.push(k);
      }

      const pickYear = () => {
        // 1) 현재 연도 데이터가 있으면 그걸 사용
        if (localStorage.getItem(`memorized:${currentYear}`)) return currentYear;

        // 2) 없으면 memorized:* 중 가장 많이 완료된 연도 선택
        let bestYear = currentYear;
        let bestCount = -1;

        for (const k of memoKeys) {
          const y = parseInt(k.split(":")[1], 10);
          const map = safeJSON.read(k, {});
          const c = countDoneMap(map);
          if (c > bestCount) {
            bestCount = c;
            bestYear = Number.isFinite(y) ? y : currentYear;
          }
        }
        return bestYear;
      };

      const year = pickYear();
      const doneMap = safeJSON.read(`memorized:${year}`, {});
      setProgressUI("memo", countDoneMap(doneMap), totalWeeks);
    } catch (_) {
      setProgressUI("memo", 0, 32);
    }

    // 2) 42주 성경 1독
    try {
      const plan = await fetch("/bible-read/data.json", { cache: "no-store" }).then(r => r.json());
      const totalDays = Array.isArray(plan)
        ? plan.length
        : Array.isArray(plan?.weeks)
          ? plan.weeks.reduce((sum, week) => sum + (Array.isArray(week.days) ? week.days.length : 0), 0)
          : 294;

      const p = safeJSON.read("bibleRead:progress:v2", { activeCycle: 1, cycles: {} });
      const cycle = String(p.activeCycle || 1);
      const doneMap = p.cycles?.[cycle]?.completed || {};
      setProgressUI("read", countDoneMap(doneMap), totalDays);
    } catch (_) {
      setProgressUI("read", 0, 294);
    }
  }

  initHomeProgress();

    // ---------- Home Settings Drawer ----------
    const settingsDrawer = qs("settings-drawer");
    const settingsPanel = qs("settings-panel");
    const settingsOverlay = qs("settings-overlay");
    const openSettingsBtn = qs("open-settings");
    const closeSettingsBtn = qs("close-settings");
    function lockScroll(lock) {
      document.body.style.overflow = lock ? "hidden" : "";
    }

    function openSettingsDrawer() {
      settingsDrawer?.classList.remove("hidden");
      requestAnimationFrame(() => settingsPanel?.classList.remove("translate-x-full"));
      openSettingsBtn?.setAttribute("aria-expanded", "true");
      lockScroll(true);
      window.SiteOverlay?.open("home-settings", closeSettingsDrawer);
    }

    function closeSettingsDrawer() {
      settingsPanel?.classList.add("translate-x-full");
      openSettingsBtn?.setAttribute("aria-expanded", "false");
      lockScroll(false);
      setTimeout(() => settingsDrawer?.classList.add("hidden"), 200);
      window.SiteOverlay?.close("home-settings");
    }

    openSettingsBtn?.addEventListener("click", openSettingsDrawer);
    closeSettingsBtn?.addEventListener("click", () => window.SiteOverlay?.close("home-settings") ?? closeSettingsDrawer());
    settingsOverlay?.addEventListener("click", () => window.SiteOverlay?.close("home-settings") ?? closeSettingsDrawer());

    window.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (!settingsDrawer?.classList.contains("hidden")) closeSettingsDrawer();
    });

    // ---------- Install Help ----------
    const overlay = qs("install-overlay");
    const installBtn = qs("install-btn");
    const installOk = qs("install-ok");
    const installClose = qs("install-close");
    const installDesc = qs("install-desc");

    let deferredPrompt = null;

    function isStandalone() {
      return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    }
    function isIOS() {
      return /iphone|ipad|ipod/i.test(navigator.userAgent);
    }

    const SEEN_KEY = "installHelpSeen:v1";

    function openInstallHelp() {
      if (isStandalone()) return;
      if (localStorage.getItem(SEEN_KEY)) return;
      localStorage.setItem(SEEN_KEY, "1");
      overlay.classList.remove("hidden");
    }
    function closeInstallHelp() {
      overlay.classList.add("hidden");
    }

    installOk?.addEventListener("click", closeInstallHelp);
    installClose?.addEventListener("click", closeInstallHelp);

    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;

      installBtn.classList.remove("hidden");
      installDesc.textContent = "‘설치하기’를 누르면 홈화면에 앱으로 추가할 수 있어요.";
      openInstallHelp();
    });

    installBtn?.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      closeInstallHelp();
    });

    window.addEventListener("load", () => {
      if (isStandalone()) return;
      if (isIOS()) {
        installBtn.classList.add("hidden");
        installDesc.textContent = "Safari에서 공유 버튼(□↑) → ‘홈 화면에 추가’를 눌러 설치할 수 있어요.";
        openInstallHelp();
      }
    });

    window.addEventListener("appinstalled", () => closeInstallHelp());

    // ---------- Refresh progress on BFCache / focus ----------
    window.addEventListener("pageshow", () => {
  initHomeProgress();
      updatePrayerCard();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        initHomeProgress();
        updatePrayerCard();
      }
    });
    window.addEventListener("focus", () => {
      initHomeProgress();
      updatePrayerCard();
    });

    // ---------- Theme Toggle bind (Home only) ----------
    // site.js 로드 후 사용 가능
    window.addEventListener("load", () => {
      window.SiteTheme?.bindToggleButton("#theme-toggle");
      window.SiteTextSize?.bindButtons("#text-size-controls");
    });
  </script>
</body>
</html>
